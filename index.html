<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Планировщик задач</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #222222);
      --btn-bg: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #999999);
      --card-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    h2 { margin-top: 0; font-size: 20px; }
    .input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--hint);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    button.add-btn {
      padding: 12px 18px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      padding: 12px 16px;
      border-radius: 12px;
    }
    .task-item.done span {
      text-decoration: line-through;
      color: var(--hint);
    }
    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      flex: 1;
    }
    .del-btn {
      background: none;
      border: none;
      color: #ff3b30;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }
  </style>
</head>
<body>
  <h2>Мои задачи</h2>

  <div class="input-box">
    <input type="text" id="taskInput" placeholder="Новая задача..." />
    <button class="add-btn" onclick="addTask()">OK</button>
  </div>

  <div id="tasks" class="task-list"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Получаем реальный ID пользователя из контекста Telegram
    const userId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : "default";

    async function loadTasks() {
      try {
        const res = await fetch(`/api/tasks?userId=${userId}`);
        const tasks = await res.json();
        renderTasks(tasks);
      } catch (e) {
        console.error(e);
      }
    }

    function renderTasks(tasks) {
      const container = document.getElementById("tasks");
      container.innerHTML = "";
      if (tasks.length === 0) {
        container.innerHTML = '<div style="color: var(--hint); text-align: center; margin-top: 20px;">Нет задач 🎉</div>';
        return;
      }
      tasks.forEach(task => {
        const el = document.createElement("div");
        el.className = `task-item ${task.done ? 'done' : ''}`;
        el.innerHTML = `
          <div class="task-left" onclick="toggleTask(${task.id})">
            <span>${task.done ? '✅' : '⬜'}</span>
            <span>${task.title}</span>
          </div>
          <button class="del-btn" onclick="deleteTask(${task.id})">✕</button>
        `;
        container.appendChild(el);
      });
    }

    async function addTask() {
      const inp = document.getElementById("taskInput");
      const title = inp.value.trim();
      if (!title) return;
      await fetch('/api/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ userId, title })
      });
      inp.value = "";
      loadTasks();
    }

    async function toggleTask(id) {
      await fetch('/api/toggle', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ userId, id })
      });
      loadTasks();
    }

    async function deleteTask(id) {
      await fetch('/api/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ userId, id })
      });
      loadTasks();
    }

    loadTasks();
  </script>
</body>
</html>
