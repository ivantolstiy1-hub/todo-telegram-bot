services:
  - type: web
    name: gemini-telegram-bot
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    rootDir: gemini_bot
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: ADMIN_IDS
        value: "8173946372,8562721499"
      - key: DEFAULT_MODEL
        value: "gemini-3.5-flash"
      - key: PORT
        value: "10000"
